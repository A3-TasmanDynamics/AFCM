<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#16261a"/>
      <stop offset="55%" stop-color="#1c2e20"/>
      <stop offset="100%" stop-color="#241814"/>
    </linearGradient>
    <radialGradient id="vignette" cx="50%" cy="42%" r="65%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.35"/>
    </radialGradient>
  </defs>

  <rect width="1024" height="1024" rx="140" fill="url(#bg)"/>
  <rect width="1024" height="1024" rx="140" fill="url(#vignette)"/>

  <!-- Ring -->
  <circle cx="512" cy="440" r="300" fill="none" stroke="#3a4a3c" stroke-width="6" opacity="0.55"/>

  <!-- Red cross emblem -->
  <g transform="translate(512,440)">
    <rect x="-150" y="-46" width="300" height="92" fill="#c1272d" rx="16"/>
    <rect x="-46" y="-150" width="92" height="300" fill="#c1272d" rx="16"/>
    <rect x="-150" y="-46" width="300" height="92" fill="none" stroke="#8f1a1f" stroke-width="4" rx="16"/>
    <rect x="-46" y="-150" width="92" height="300" fill="none" stroke="#8f1a1f" stroke-width="4" rx="16"/>
  </g>

  <!-- Wordmark -->
  <text x="512" y="838" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="160"
        font-weight="800" letter-spacing="6" fill="#f2efe6">AFCM</text>
  <text x="512" y="900" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="34"
        letter-spacing="3" fill="#9fae9f">TASMAN DYNAMICS</text>
</svg>
