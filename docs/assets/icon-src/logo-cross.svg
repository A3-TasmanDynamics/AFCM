<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#16261a"/>
      <stop offset="55%" stop-color="#1c2e20"/>
      <stop offset="100%" stop-color="#241814"/>
    </linearGradient>
    <linearGradient id="ecg-fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#c1272d" stop-opacity="0"/>
      <stop offset="15%" stop-color="#e2483e" stop-opacity="1"/>
      <stop offset="85%" stop-color="#e2483e" stop-opacity="1"/>
      <stop offset="100%" stop-color="#c1272d" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="vignette" cx="50%" cy="42%" r="65%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.35"/>
    </radialGradient>
  </defs>

  <rect width="1024" height="1024" rx="140" fill="url(#bg)"/>
  <rect width="1024" height="1024" rx="140" fill="url(#vignette)"/>

  <!-- Ring -->
  <circle cx="512" cy="400" r="300" fill="none" stroke="#3a4a3c" stroke-width="6" opacity="0.55"/>

  <!-- Red cross emblem, shifted up to leave the lower ring clear for the ECG strip -->
  <g transform="translate(512,370)">
    <rect x="-130" y="-40" width="260" height="80" fill="#c1272d" rx="14"/>
    <rect x="-40" y="-130" width="80" height="260" fill="#c1272d" rx="14"/>
    <rect x="-130" y="-40" width="260" height="80" fill="none" stroke="#8f1a1f" stroke-width="4" rx="14"/>
    <rect x="-40" y="-130" width="80" height="260" fill="none" stroke="#8f1a1f" stroke-width="4" rx="14"/>
  </g>

  <!-- ECG trace: a monitor strip along the lower ring, clear of the cross so it reads as a
       heartbeat line rather than wrapping around the emblem -->
  <path d="M270,610 L390,610 L406,610 L422,580 L444,650 L466,570 L488,610 L512,610
           L536,610 L558,570 L580,650 L602,580 L618,610 L634,610 L754,610"
        fill="none" stroke="url(#ecg-fade)" stroke-width="10" stroke-linejoin="round" stroke-linecap="round"/>

  <!-- Wordmark -->
  <text x="512" y="838" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="160"
        font-weight="800" letter-spacing="6" fill="#f2efe6">AFCM</text>
  <text x="512" y="900" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="34"
        letter-spacing="3" fill="#9fae9f">TASMAN DYNAMICS</text>
</svg>
