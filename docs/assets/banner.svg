<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 280" width="1200" height="280">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0e1a12"/>
      <stop offset="55%" stop-color="#152318"/>
      <stop offset="100%" stop-color="#1c1210"/>
    </linearGradient>
    <linearGradient id="ecg-fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#c1272d" stop-opacity="0"/>
      <stop offset="12%" stop-color="#c1272d" stop-opacity="1"/>
      <stop offset="88%" stop-color="#c1272d" stop-opacity="1"/>
      <stop offset="100%" stop-color="#c1272d" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#2a3a2e" stroke-width="1" opacity="0.35"/>
    </pattern>
  </defs>

  <rect width="1200" height="280" fill="url(#bg)"/>
  <rect width="1200" height="280" fill="url(#grid)"/>

  <!-- ECG trace -->
  <path d="M0,190 L260,190 L288,190 L302,150 L318,230 L334,110 L350,190 L378,190
           L860,190 L888,190 L902,150 L918,230 L934,110 L950,190 L1200,190"
        fill="none" stroke="url(#ecg-fade)" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round"/>

  <!-- Red cross emblem -->
  <g transform="translate(96,140)">
    <rect x="-34" y="-10" width="68" height="20" fill="#c1272d" rx="3"/>
    <rect x="-10" y="-34" width="20" height="68" fill="#c1272d" rx="3"/>
  </g>

  <!-- Wordmark -->
  <text x="180" y="128" font-family="Segoe UI, Arial, sans-serif" font-size="76" font-weight="700"
        letter-spacing="6" fill="#f2efe6">AFCM</text>
  <text x="182" y="168" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="400"
        letter-spacing="1.5" fill="#c9c2ad">Australian First Combat Medicine</text>

  <!-- Divider -->
  <rect x="182" y="188" width="640" height="2" fill="#3a4a3c"/>

  <text x="182" y="216" font-family="Segoe UI, Arial, sans-serif" font-size="17" letter-spacing="0.5" fill="#8a9a8c">
    Physiology-based medical overhaul for Arma 3
  </text>

  <!-- Studio mark -->
  <text x="1180" y="256" text-anchor="end" font-family="Segoe UI, Arial, sans-serif" font-size="15"
        letter-spacing="3" fill="#6f7d70">TASMAN DYNAMICS</text>
</svg>
